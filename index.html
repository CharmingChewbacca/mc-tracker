<style>
  :root {
    --blue:    #3457A6;
    --blue-lt: #EEF1F8;
    --gold:    #E8A33D;
    --gold-lt: #FEF3D7;
    --teal:    #5FA8A0;
    --teal-lt: #E8F2F0;
    --green:   #6B8F47;
    --green-lt:#E6F2DC;
    --red:     #B3463B;
    --red-lt:  #F8E8E6;
    --purple:  #7A5FA6;
    --purple-lt:#F0EBF8;
    --dark:    #1C1C1C;
    --mid:     #6B6B65;
    --muted:   #9A9A94;
    --border:  #E7E5E0;
    --bg:      #FAFAF8;
    --white:   #FFFFFF;
    --warm:    #F0EDE7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

  header { background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .hd-top { max-width: 1100px; margin: 0 auto; padding: 1.1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .hd-brand p { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue); }
  .hd-brand h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
  .hd-right { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .save-dot.unsaved { background: var(--gold); }
  .save-label { font-size: 0.72rem; color: var(--muted); }

  .strip-wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 0.75rem; }
  .strip { height: 6px; border-radius: 99px; background: var(--warm); display: flex; overflow: hidden; margin-bottom: 0.5rem; }
  .strip-seg { height: 100%; }
  .strip-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; }
  .strip-leg { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: var(--mid); }
  .strip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .stats-row { max-width: 1100px; margin: 0 auto; padding: 0.5rem 1.5rem 0.9rem; display: grid; grid-template-columns: repeat(4,1fr); gap: 0.75rem; }
  .stat { background: var(--warm); border: 1px solid #D3D0C5; border-radius: 10px; padding: 0.6rem 0.9rem; transition: box-shadow 0.15s, transform 0.15s; }
  .stat.tint-green  { background: var(--green-lt);  border-color: #C0D9B0; }
  .stat.tint-gold   { background: var(--gold-lt);   border-color: #F0D070; }
  .stat.tint-red    { background: var(--red-lt);    border-color: #EFC5BE; }
  .stat.tint-blue   { background: var(--blue-lt);   border-color: #C5D4EE; }
  .stat.tint-green .stat-label  { color: var(--green); }
  .stat.tint-gold .stat-label   { color: #B07A1A; }
  .stat.tint-red .stat-label    { color: var(--red); }
  .stat.tint-blue .stat-label   { color: var(--blue); }
  .stat.tint-total { background: var(--mid); border-color: var(--mid); }
  .stat.tint-total .stat-label { color: #E7E5E0; }
  .stat.tint-total .stat-val { color: var(--white); }
  .stat-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .stat-val { font-size: 1.05rem; font-weight: 800; margin-top: 0.15rem; }

  .tab-bar { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; display: flex; gap: 1.5rem; border-top: 1px solid var(--border); }
  .tab-action { margin-left: auto; align-self: center; display: flex; align-items: center; gap: 0.75rem; }
  .tab-note { font-size: 0.7rem; font-weight: 700; color: #B07A1A; }
  .tab-btn { background: none; border: none; cursor: pointer; padding: 0.65rem 0; font-size: 0.85rem; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .sec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 0.75rem; flex-wrap: wrap; }
  .sec-title { font-size: 0.95rem; font-weight: 700; }
  .sec-actions { display: flex; gap: 0.5rem; align-items: center; }

  .pipeline-sections { display: flex; flex-direction: column; gap: 0.875rem; }
  .stage-section { background: var(--white); border: 1px solid var(--border); border-radius: 0.85rem; overflow: hidden; }
  .stage-section-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1rem; background: var(--warm); border-bottom: 1px solid var(--border); }
  .stage-empty { padding: 0.85rem 1rem; font-size: 0.75rem; color: #C2C0B8; }
  .stage-cards-row { align-items: start; display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 0.75rem; padding: 0.875rem; }
  .col-head-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--mid); }
  .col-count { margin-left: auto; font-size: 0.65rem; font-weight: 700; color: var(--muted); }
  .col-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* Archive section */
  .archive-section { margin-top: 1.5rem; border: 1px solid var(--border); border-radius: 0.85rem; overflow: hidden; }
  .archive-head { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--warm); cursor: pointer; user-select: none; }
  .archive-head-label { font-size: 0.72rem; font-weight: 700; color: var(--mid); }
  .archive-chevron { margin-left: auto; font-size: 0.75rem; color: var(--muted); transition: transform 0.2s; }
  .archive-chevron.open { transform: rotate(180deg); }
  .archive-cards { align-items: start; display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 0.75rem; padding: 0.875rem; }
  .archive-empty { padding: 0.875rem 1rem; font-size: 0.75rem; color: #C2C0B8; }
  .card.archived { opacity: 0.7; }

  .card { background: var(--white); border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.8rem; transition: box-shadow 0.15s, transform 0.15s; }
  .home-group-divider { grid-column: 1 / -1; border-top: 1px solid var(--border); margin: 0.3rem 0; }
  .card:not(.archived):hover { box-shadow: 0 4px 14px rgba(28,28,28,0.08); transform: translateY(-1px); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.4rem; margin-bottom: 0.25rem; }
  .card-name { font-weight: 700; font-size: 0.8rem; line-height: 1.3; }
  .card-contact { font-size: 0.7rem; color: var(--mid); margin-top: 0.1rem; }
  .card-icons { display: flex; gap: 0.2rem; flex-shrink: 0; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 0.78rem; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border-radius: 4px; color: #C2C0B8; line-height: 1; }
  .icon-btn:hover { color: var(--blue); }
  .icon-btn.del:hover { color: var(--red); }
  .card-detail { font-size: 0.7rem; color: var(--mid); margin-top: 0.12rem; }
  .card-detail-strong { font-weight: 700; color: var(--dark); margin-top: 0.3rem; }
  .card-divider { border-top: 1px solid var(--border); margin: 0.5rem 0 0.4rem; }
  .card-email { font-size: 0.7rem; color: var(--blue); text-decoration: none; display: block; margin-top: 0.12rem; background: none; border: none; padding: 0; text-align: left; cursor: pointer; font-family: inherit; }
  .card-email-all { font-size: 0.7rem; font-weight: 700; color: var(--blue); text-decoration: none; display: block; margin-top: 0.5rem; background: none; border: none; padding: 0; text-align: left; cursor: pointer; font-family: inherit; }
  .card-email-all:hover { text-decoration: underline; }
  .card-email:hover { text-decoration: underline; }
  .card-email:hover { text-decoration: underline; }
  .card-note { font-size: 0.68rem; color: var(--mid); font-style: italic; background: var(--bg); border-radius: 0.4rem; padding: 0.4rem 0.55rem; margin: 0.6rem 0 0.5rem; cursor: pointer; transition: background .15s; }
  .card-note:last-child { margin-bottom: 0; }
  .card-note:hover { background: var(--warm); }
  .card-note.empty { font-style: normal; color: var(--muted); background: none; padding: 0.1rem 0; }
  .card-note.empty:hover { background: none; color: var(--mid); text-decoration: underline; }
  .card-name-link { cursor: pointer; }
  .card-name-link:hover { color: var(--blue); }
  .due-ok { color: var(--mid); }
  .due-soon { color: #B07A1A; font-weight: 600; }
  .due-over { color: var(--red); font-weight: 700; }
  .inv-badge { display: inline-block; font-size: 0.6rem; font-weight: 700; border-radius: 0.4rem; padding: 0.12rem 0.5rem; margin-top: 0.2rem; }
  .contract-badge { display: inline-block; font-size: 0.6rem; font-weight: 700; border-radius: 0.4rem; padding: 0.12rem 0.5rem; margin-top: 0.2rem; margin-left: 0.3rem; }
  .badge-row { margin-top: 0.35rem; }
  .stage-select { margin-top: 0.55rem; width: 100%; font-size: 0.7rem; border: 1px solid var(--border); border-radius: 0.45rem; padding: 0.28rem 0.4rem; background: var(--bg); cursor: pointer; }

  /* Follow-up flag */
  .followup-badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.6rem; font-weight: 700; border-radius: 0.4rem; padding: 0.12rem 0.5rem; margin-top: 0.2rem; color: #B07A1A; background: #FEF3D7; }
  .card.needs-followup { border-color: #F0D070; }
  .followup-toggle.on { color: #B07A1A; }
  .icon-btn.pencil-icon { transform: scaleX(-1); }
  .icon-btn.flip-icon { transform: scaleX(-1); }
  .icon-btn svg { display: block; }

  /* Outreach / prospect cards */
  .prospect-actions { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
  .status-pill { display: inline-block; font-size: 0.6rem; font-weight: 700; border-radius: 0.4rem; padding: 0.12rem 0.5rem; margin-top: 0.2rem; }
  .status-pill.converted { color: #4A7A2A; background: #E6F2DC; }
  .status-pill.inactive { color: #6B6B65; background: #F0EDE7; }

  /* Hours */
  .hours-breakdown { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
  .breakdown-card { border-radius: 0.75rem; padding: 0.75rem 1rem; }
  .breakdown-card.billable { background: var(--blue-lt); border: 1px solid #C5D4EE; }
  .breakdown-card.volunteer { background: var(--green-lt); border: 1px solid #C0D9B0; }
  .breakdown-card.internal { background: var(--teal-lt); border: 1px solid #BFE0DB; }
  .breakdown-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  .breakdown-label.billable { color: var(--blue); }
  .breakdown-label.volunteer { color: var(--green); }
  .breakdown-label.internal { color: var(--teal); }
  .breakdown-val { font-size: 1.1rem; font-weight: 800; margin-top: 0.15rem; }

  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
  .summary-card { background: var(--white); border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.85rem 1rem; }
  .summary-name { font-weight: 700; font-size: 0.85rem; }
  .summary-detail { font-size: 0.72rem; color: var(--mid); margin-top: 0.2rem; }

  .table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { padding: 0.65rem 1rem; text-align: left; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  td { padding: 0.6rem 1rem; border-bottom: 1px solid #F5F3EE; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.muted { color: var(--mid); }
  .row-actions { display: flex; gap: 0.3rem; justify-content: flex-end; }
  .empty-state { border: 1.5px dashed var(--border); border-radius: 0.9rem; padding: 3rem 1rem; text-align: center; font-size: 0.85rem; color: var(--muted); }

  /* Entry type badge */
  .type-pill { display: inline-block; font-size: 0.6rem; font-weight: 700; border-radius: 0.4rem; padding: 0.1rem 0.45rem; }
  .type-pill.billable { background: var(--blue-lt); color: var(--blue); }
  .type-pill.volunteer { background: var(--green-lt); color: var(--green); }
  .type-pill.internal { background: var(--teal-lt); color: var(--teal); }

  /* Entry type toggle (3-way) */
  .type-toggle { display: flex; border: 1px solid var(--border); border-radius: 99px; overflow: hidden; width: fit-content; }
  .type-toggle input { display: none; }
  .type-toggle label { padding: 0.3rem 0.75rem; font-size: 0.72rem; font-weight: 700; cursor: pointer; color: var(--muted); transition: background .15s, color .15s; }
  .type-toggle input[value="billable"]:checked ~ label[for="tt-billable"],
  .type-toggle input[value="volunteer"]:checked ~ label[for="tt-volunteer"],
  .type-toggle input[value="internal"]:checked ~ label[for="tt-internal"] { background: var(--blue); color: var(--white); }
  .type-toggle input[value="volunteer"]:checked ~ label[for="tt-volunteer"] { background: var(--green); }
  .type-toggle input[value="internal"]:checked ~ label[for="tt-internal"] { background: var(--teal); }

  .btn { font-size: 0.82rem; font-weight: 700; border: none; border-radius: 0.45rem; padding: 0.48rem 1.1rem; cursor: pointer; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--blue); color: var(--white); }
  .btn-dark { background: var(--dark); color: var(--white); }
  .btn-outline { background: var(--white); color: var(--blue); border: 1.5px solid var(--blue); }
  .btn-ghost { background: var(--warm); color: var(--dark); border: none; }
  .btn-sm { font-size: 0.72rem; padding: 0.32rem 0.8rem; }

  .add-panel { background: var(--white); border: 1px solid var(--border); border-radius: 1rem; padding: 1.2rem; margin-bottom: 1.25rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1rem; }
  .form-full { grid-column: 1 / -1; }
  .form-group label { display: block; font-size: 0.68rem; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 0.55rem; padding: 0.48rem 0.65rem;
    font-size: 0.82rem; background: var(--bg); font-family: inherit; outline: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--blue); box-shadow: 0 0 0 2px rgba(52,87,166,0.12);
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; margin-top: 0.25rem; flex-wrap: wrap; align-items: center; }
  .contact-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1rem; margin-bottom: 0.5rem; align-items: center; }
  .contact-row input { width: 100%; min-width: 0; }
  .contact-row-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1rem; }
  .contact-email-wrap { position: relative; }

  #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; }

  .show-completed { background: none; border: none; cursor: pointer; font-size: 0.72rem; color: var(--muted); padding: 0.35rem 0; }
  .detail-add-form { background: var(--bg); border: 1px solid var(--border); border-radius: 0.65rem; padding: 0.75rem; margin-top: 0.65rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .detail-add-form input, .detail-add-form select, .detail-add-form textarea { width: 100%; border: 1px solid var(--border); border-radius: 0.45rem; padding: 0.38rem 0.55rem; font-size: 0.8rem; background: var(--white); font-family: inherit; outline: none; }
  .detail-add-form input:focus, .detail-add-form select:focus, .detail-add-form textarea:focus { border-color: var(--blue); }
  .detail-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

  @media(max-width:800px) {
    .form-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .hours-breakdown { grid-template-columns: 1fr; }
  }


  /* ── Client Info ── */
  .card-info-link { display: inline-block; background: none; border: none; padding: 0; margin-top: 0.45rem; font-family: inherit; font-size: 0.72rem; font-weight: 700; color: var(--blue); cursor: pointer; }
  .card-info-link:hover { text-decoration: underline; }
  .info-group { background: var(--bg); border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.35rem 0.85rem 0.5rem; margin-bottom: 0.6rem; }
  .info-group-title { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0.45rem 0 0.2rem; }
  .info-item { display: grid; grid-template-columns: 9.5rem 1fr auto; gap: 0.6rem; align-items: center; padding: 0.4rem 0; border-top: 1px solid var(--border); }
  .info-group-title + .info-item, .info-account-name + .info-item { border-top: none; }
  .info-label { font-size: 0.72rem; color: var(--mid); }
  .info-value { font-size: 0.82rem; color: var(--dark); min-width: 0; overflow-wrap: anywhere; }
  .info-value.multiline { white-space: pre-line; }

  .info-value a:hover { text-decoration: underline; }
  .info-copy { justify-self: end; }
  .info-account { border-top: 1px solid var(--border); padding: 0.5rem 0 0.3rem; }
  .info-group-title + .info-account { border-top: none; }
  .info-account-name { font-size: 0.82rem; font-weight: 700; }
  .info-pw-note { font-size: 0.7rem; color: var(--muted); padding-top: 0.2rem; }
  .info-account-note { font-size: 0.75rem; color: var(--mid); font-style: italic; padding-top: 0.15rem; }
  .info-empty { font-size: 0.78rem; color: var(--muted); padding: 0.25rem 0 0.5rem; }
  .info-edit-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dark); margin: 1.2rem 0 0.6rem; padding-top: 0.9rem; border-top: 1px solid var(--border); }
  .info-edit-hint { font-size: 0.74rem; color: var(--mid); margin: -0.3rem 0 0.6rem; }
  .info-edit-row { display: grid; gap: 0.45rem; align-items: center; margin-bottom: 0.5rem; }
  .info-edit-row.pair { grid-template-columns: 10rem 1fr auto; }
  .info-edit-row.color { grid-template-columns: auto 1fr 7.5rem auto; }
  .info-edit-row.account, .info-edit-row.card3 { grid-template-columns: 1fr auto; background: var(--bg); border: 1px solid var(--border); border-radius: 0.65rem; padding: 0.6rem; }
  .info-edit-row.account .ir-url, .info-edit-row.account .ir-user, .info-edit-row.account .ir-note { grid-column: 1 / -1; }

  .swatch { display: inline-block; width: 1.1rem; height: 1.1rem; border-radius: 0.3rem; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0; vertical-align: middle; }
  .edit-swatch { width: 1.9rem; height: 1.9rem; border-radius: 0.45rem; background: repeating-linear-gradient(45deg,#f0ede7 0 4px,#fff 4px 8px); }
  .color-val { display: flex; align-items: center; gap: 0.5rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }

  .info-sub { font-size: 0.72rem; color: var(--mid); margin-top: 0.1rem; }
  .info-list-label { display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); margin: 0.9rem 0 0.3rem; }
  .info-add-btn { border-radius: 0.45rem; }
  .info-edit-title.first { border-top: none; padding-top: 0; margin-top: 0.5rem; }
  .info-edit-row input, .info-edit-row select { width: 100%; border: 1px solid var(--border); border-radius: 0.45rem; padding: 0.45rem 0.6rem; font-size: 0.82rem; background: var(--white); font-family: inherit; outline: none; }
  .info-edit-row input:focus, .info-edit-row select:focus { border-color: var(--blue); }

  /* ── Sync status ── */
  .save-dot.saving { background: var(--gold); }
  .save-dot.error { background: var(--red); }
  .hd-user { font-size: 0.72rem; color: var(--muted); }
  .link-btn { background: none; border: none; cursor: pointer; font-size: 0.72rem; color: var(--mid); text-decoration: underline; padding: 0; font-family: inherit; }

  /* ── Sign-in / setup / loading screens ── */
  .auth-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .auth-card { background: var(--white); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; width: 100%; max-width: 380px; }
  .auth-card .hd-brand { margin-bottom: 1.25rem; }
  .auth-card .form-group { margin-bottom: 0.85rem; }
  .auth-card .btn { width: 100%; padding: 0.7rem; margin-top: 0.25rem; }
  .auth-msg { font-size: 0.78rem; color: var(--red); margin-bottom: 0.85rem; }
  .auth-note { font-size: 0.78rem; color: var(--mid); line-height: 1.5; }
  .auth-note code { background: var(--warm); padding: 0.05rem 0.3rem; border-radius: 0.25rem; }
  .loading { text-align: center; font-size: 0.85rem; color: var(--muted); }
  .sample-cta { margin-top: 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }

  /* ── Quick "Log Hours" button (phone only) ── */
  .fab { display: none; }
  .h-unit { display: none; }

  /* ── Phone layout ── */
  @media(max-width:700px) {
    header { position: static; }
    .hd-top { padding: 0.85rem 1rem 0.6rem; padding-top: calc(0.85rem + env(safe-area-inset-top)); }
    .hd-brand h1 { font-size: 1.1rem; }
    .desktop-only { display: none !important; }
    .stats-row { grid-template-columns: repeat(2,1fr); gap: 0.45rem; padding: 0.15rem 1rem 0.75rem; }
    .stat { padding: 0.45rem 0.7rem; border-radius: 8px; min-width: 0; }
    .stat-label { font-size: 0.56rem; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-val { font-size: 1rem; margin-top: 0.05rem; }
    .tab-bar { padding: 0 1rem; gap: 1.1rem; }
    .tab-note { display: none; }
    .tab-action .btn { display: none; } /* the floating button does this job on phone */
    .tab-btn { padding: 0.75rem 0; font-size: 0.9rem; }
    main { padding: 1rem 1rem calc(6rem + env(safe-area-inset-bottom)); }
    .card { padding: 0.95rem; }
    .card-name { font-size: 0.9rem; }
    .card-contact, .card-detail, .card-email { font-size: 0.78rem; }
    .card-note { font-size: 0.78rem; }
    .icon-btn { width: 32px; height: 32px; }
    .icon-btn svg { width: 15px; height: 15px; }
    .stage-select { font-size: 16px; }
    .form-group input, .form-group select, .form-group textarea,
    .detail-add-form input, .detail-add-form select, .detail-add-form textarea,
    .contact-row input { font-size: 16px; padding: 0.6rem 0.7rem; } /* 16px stops iPhone auto-zoom */
    input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 2.75rem; box-sizing: border-box; text-align: left; }
    input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
    .btn-sm { font-size: 0.82rem; padding: 0.5rem 0.95rem; }
    .form-actions .btn { flex: 1; }
    .summary-grid { grid-template-columns: repeat(2,1fr); }
    .hours-breakdown { grid-template-columns: repeat(3,1fr); gap: 0.5rem; margin-bottom: 1rem; }
    .breakdown-card { padding: 0.6rem 0.7rem; }
    .breakdown-val { font-size: 0.95rem; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    /* Hours log: each entry becomes a compact row — no sideways scrolling */
    .hours-table { min-width: 0; display: block; }
    .hours-table thead { display: none; }
    .hours-table tbody { display: block; }
    .hours-table tr { display: grid; grid-template-columns: auto auto 1fr auto; grid-template-areas: "client client client hours" "date type . actions" "note note note note"; column-gap: 0.6rem; row-gap: 0.3rem; align-items: center; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); }
    .hours-table tr:last-child { border-bottom: none; }
    .hours-table td { display: block; padding: 0; border: none; }
    .hours-table .h-client { grid-area: client; min-width: 0; }
    .hours-table .h-contact { display: none !important; }
    .hours-table .h-unit { display: inline; font-weight: 600; color: var(--mid); }
    .hours-table .h-hours { grid-area: hours; font-weight: 700; text-align: right; white-space: nowrap; }
    .hours-table .h-date { grid-area: date; font-size: 0.8rem; white-space: nowrap; }
    .hours-table .h-type { grid-area: type; }
    .hours-table .h-actions { grid-area: actions; justify-self: end; margin-right: -8.5px; } /* line the X glyph up with the hours text, not its invisible tap area */
    .hours-table .h-note { grid-area: note; font-size: 0.82rem; }
    .hours-table .h-note:empty { display: none; }
    table { min-width: 560px; }
    #modal-overlay { align-items: flex-end; padding: 0; }
    #modal-box { border-radius: 1rem 1rem 0 0; padding: 1.25rem 1.1rem calc(1.25rem + env(safe-area-inset-bottom)); max-height: 92vh; max-height: 92dvh; }
    #toast { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(5.5rem + env(safe-area-inset-bottom)); white-space: nowrap; }
    .fab { display: inline-flex; align-items: center; gap: 0.4rem; position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom)); z-index: 50;
      background: var(--blue); color: var(--white); border: none; border-radius: 0.7rem; padding: 0.85rem 1.25rem; font-size: 0.95rem; font-weight: 800; font-family: inherit;
      box-shadow: 0 8px 24px rgba(52,87,166,0.35); cursor: pointer; }
    .info-item { grid-template-columns: 1fr auto; row-gap: 0.1rem; }
    .info-label { grid-column: 1; }
    .info-value { grid-column: 1; }
    .info-copy, .pw-btns { grid-column: 2; grid-row: 1 / span 2; }
    .info-edit-row.pair { grid-template-columns: 7.5rem 1fr auto; }
    .info-edit-row.color { grid-template-columns: auto 1fr 6.5rem auto; }
    .info-edit-row input, .info-edit-row select { font-size: 16px; }
    .auth-card { padding: 1.5rem; }
  }
</style>

<body>
<div id="root"></div>
<div id="modal-overlay"><div id="modal-box"></div></div>
<div id="toast"></div>
<input type="file" id="import-input" accept=".json">
<script>
// ── CONSTANTS ────────────────────────────────────────────────────
const SERVICES = ['Brand & Web Design','Brand Design','General Design','Internal','Volunteer Work','Web Design'];
const DEPOSIT_SHARE = 0.5; // your deposit is 50% of the project price
const INV = [
  // 50% deposit → 50% final. 'invoiced' keeps its old id so existing "Invoiced" clients become "Deposit Invoiced".
  { id:'not_invoiced',   label:'Not Invoiced',     color:'#6B6B65', bg:'#F0EDE7', paidShare:0 },
  { id:'invoiced',       label:'Deposit Invoiced', color:'#B07A1A', bg:'#FEF3D7', paidShare:0 },
  { id:'deposit_paid',   label:'Deposit Paid',     color:'#3457A6', bg:'#EEF0F8', paidShare:DEPOSIT_SHARE },
  { id:'final_invoiced', label:'Final Invoiced',   color:'#B07A1A', bg:'#FEF3D7', paidShare:DEPOSIT_SHARE },
  { id:'paid',           label:'Paid in Full',     color:'#4A7A2A', bg:'#E6F2DC', paidShare:1 },
];
const QUEST = [
  { id:'not_sent',  label:'Not Sent',  color:'#6B6B65', bg:'#F0EDE7' },
  { id:'sent',      label:'Sent',      color:'#B07A1A', bg:'#FEF3D7' },
  { id:'completed', label:'Completed', color:'#4A7A2A', bg:'#E6F2DC' },
];
const CONTRACT = [
  { id:'not_sent', label:'Not Sent', color:'#6B6B65', bg:'#F0EDE7' },
  { id:'sent',     label:'Sent',     color:'#B07A1A', bg:'#FEF3D7' },
  { id:'signed',   label:'Signed',   color:'#4A7A2A', bg:'#E6F2DC' },
];
const REFERRALS = ['—','Word of Mouth','Website','Social Media','Past Client','Professional Referral','Other'];
const ACTIVITY_TYPES = ['Call','Email','Meeting','Note'];
const CONTACT_METHODS = ['—','Email','Phone Call','Text','In Person','Social Media','Other'];
const ENTRY_TYPES = [
  { id:'billable',  label:'Billable',  color:'#3457A6', bg:'#EEF1F8' },
  { id:'volunteer', label:'Volunteer', color:'#6B8F47', bg:'#E6F2DC' },
  { id:'internal',  label:'Internal',  color:'#5FA8A0', bg:'#E8F2F0' },
];

// ── ICONS (inline SVG — evenly weighted & truly centered, unlike text glyphs) ──
const ICON_FLAG   = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`;
const ICON_PENCIL = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
const ICON_RETURN = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>`;
const ICON_COPY   = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const ICON_EYE    = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_CLOSE  = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

// ── STATE ────────────────────────────────────────────────────────
const state = { clients:[], hoursLog:[], prospects:[], tab:'home', showAdd:null, showArchive:true, showInactiveProspects:true, saveStatus:'saved', detailClientId:null };
let saveTimer=null, toastTimer=null;

// ── STORAGE ──────────────────────────────────────────────────────
function migrateClientsAndProspects(rawClients) {
  // Old model: 4-stage pipeline (pending/active/followup/completed) + archived flag.
  // New model: clients are Active or Past (archived); Pending clients become Outreach
  // prospects; Follow-Up becomes a "Needs Follow-Up" flag on an active client.
  const sm = { inquiry:'pending', proposal:'pending', active:'active', followup:'followup', completed:'completed' };
  const clients = [], prospectsFromMigration = [];
  (rawClients||[]).forEach(raw=>{
    const c = {
      email:'', dueDate:'', invoiceStatus:'not_invoiced', contactName:'',
      contractStatus:'not_sent', questionnaireStatus:'not_sent', referralSource:'', notes:'', archived:false,
      needsFollowUp:false, contacts:[], activities:[], tasks:[],
      ...raw,
      businessName: raw.businessName||raw.name||'',
      contacts: raw.contacts||[], activities: raw.activities||[], tasks: raw.tasks||[],
    };
    if (c.service==='Other') c.service='General Design';
    const stage = sm[raw.stage]||raw.stage;
    if (stage==='pending' && !c.archived) {
      // Move unconverted leads into Outreach instead of the client list.
      prospectsFromMigration.push({
        id:c.id, dateAdded:c.dateAdded||today(),
        businessName:c.businessName, contactName:c.contactName, email:c.email,
        referralSource:c.referralSource, nextContactDate:'', notes:c.notes,
        contacts:c.contacts, archived:false, converted:false, activities:[],
      });
      return;
    }
    if (stage==='completed') c.archived = true;
    if (stage==='followup') c.needsFollowUp = true;
    delete c.stage;
    clients.push(c);
  });
  return { clients, prospectsFromMigration };
}

// Turns saved data (any version of the format) into app state.
function applyData(p) {
  p = p || {};
  const { clients, prospectsFromMigration } = migrateClientsAndProspects(p.clients);
  state.clients = clients;
  state.hoursLog = (p.hoursLog||[]).map(h=>({ entryType:'billable', ...h }));
  state.prospects = (p.prospects||[]).map(pr=>({
    dateAdded:'', businessName:'', contactName:'', email:'', referralSource:'',
    nextContactDate:'', lastContactDate:'', contactMethod:'', notes:'', contacts:[], archived:false, converted:false, ...pr,
  })).concat(prospectsFromMigration);
}
function snapshot() { return { clients:state.clients, hoursLog:state.hoursLog, prospects:state.prospects }; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

// ── SYNC (Supabase) ──────────────────────────────────────────────
// All data lives in ONE private row per user (table crm_state). Row-level security in the
// database means only the signed-in owner can read or write it.
// Every save bumps a version number. If another device saved in the meantime, the save is
// rejected, the two versions are merged record-by-record, and the merge is saved instead —
// so editing on your phone and Mac never silently overwrites the other.
const CFG = window.CRM_CONFIG || {};
let sb=null, userId=null, userEmail='';
let syncVersion=null, baseSnapshot=null;     // last version known to be on the server
let saving=false, saveQueued=false, dirty=false, changeSeq=0, retryTimer=null;

async function fetchRemote() {
  const { data, error } = await sb.from('crm_state').select('data,version').eq('user_id', userId).maybeSingle();
  if (error) throw error;
  return data;
}

async function loadRemote() {
  const row = await fetchRemote();
  if (row) {
    applyData(row.data);
    syncVersion = row.version;
  } else {
    state.clients=[]; state.hoursLog=[]; state.prospects=[];
    const { data, error } = await sb.from('crm_state').insert({ user_id:userId, data:snapshot(), version:1 }).select('version').single();
    if (error) throw error;
    syncVersion = data.version;
  }
  baseSnapshot = clone(snapshot());
}

// Three-way merge for one list: keeps changes from both devices, honours deletes.
function mergeList(base=[], local=[], remote=[]) {
  const baseMap = new Map(base.map(x=>[x.id, JSON.stringify(x)]));
  const localMap = new Map(local.map(x=>[x.id, x]));
  const out = [], seen = new Set();
  remote.forEach(r=>{
    seen.add(r.id);
    const l = localMap.get(r.id), inBase = baseMap.has(r.id);
    if (l) out.push(!inBase || JSON.stringify(l)!==baseMap.get(r.id) ? l : r); // local edit wins only if local actually changed it
    else if (!inBase) out.push(r);                                             // added on the other device
    // else: deleted on this device → drop
  });
  local.forEach(l=>{ if (!seen.has(l.id) && !baseMap.has(l.id)) out.push(l); }); // added on this device
  return out;
}
function mergeThreeWay(base, local, remote) {
  return {
    clients:   mergeList(base.clients,   local.clients,   remote.clients),
    prospects: mergeList(base.prospects, local.prospects, remote.prospects),
    hoursLog:  mergeList(base.hoursLog,  local.hoursLog,  remote.hoursLog),
  };
}

async function saveData() {
  clearTimeout(saveTimer); clearTimeout(retryTimer);
  if (!sb || !userId || syncVersion===null) return;
  if (saving) { saveQueued = true; return; }
  saving = true; setSync('saving');
  const seqAtStart = changeSeq;
  let merged = false;
  try {
    for (let attempt=0; ; attempt++) {
      const payload = clone(snapshot()), next = syncVersion + 1;
      const { data, error } = await sb.from('crm_state')
        .update({ data:payload, version:next, updated_at:new Date().toISOString() })
        .eq('user_id', userId).eq('version', syncVersion).select('version');
      if (error) throw error;
      if (data && data.length) { syncVersion = next; baseSnapshot = payload; break; }
      // Another device saved first — merge and try again.
      if (attempt >= 3) throw new Error('Could not merge changes');
      const remote = await fetchRemote();
      if (!remote) throw new Error('Saved data not found');
      const m = mergeThreeWay(baseSnapshot, snapshot(), remote.data||{});
      state.clients = m.clients; state.prospects = m.prospects; state.hoursLog = m.hoursLog;
      syncVersion = remote.version; baseSnapshot = clone(remote.data||{});
      merged = true;
    }
    if (changeSeq === seqAtStart) dirty = false;
    setSync(dirty ? 'saving' : 'saved');
    if (merged) {
      if (!state.showAdd) renderApp();
      showToast('Merged with changes from your other device.');
    }
  } catch (e) {
    setSync('error');
    retryTimer = setTimeout(saveData, 8000);
  } finally {
    saving = false;
    if (saveQueued) { saveQueued = false; saveData(); }
  }
}

function scheduleAutoSave() {
  dirty = true; changeSeq++;
  setSync('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 800);
}

// Pull the latest from the server when you come back to the app (e.g. switching from phone to Mac).
async function refreshFromRemote() {
  if (!sb || !userId || syncVersion===null || saving || dirty) return;
  if (document.getElementById('modal-overlay').classList.contains('open') || state.showAdd) return;
  try {
    const row = await fetchRemote();
    if (row && row.version !== syncVersion && !dirty && !saving) {
      applyData(row.data); syncVersion = row.version; baseSnapshot = clone(snapshot());
      renderApp();
    }
    if (state.saveStatus==='error') setSync('saved');
  } catch (e) { /* offline — try again next time */ }
}

function setSync(s) { state.saveStatus = s; renderStatusDot(); }

function renderStatusDot() {
  const dot=document.querySelector('.save-dot'), lbl=document.querySelector('.save-label');
  if(!dot||!lbl) return;
  const s = state.saveStatus;
  dot.className = 'save-dot' + (s==='saving'?' saving':s==='error'?' error':'');
  lbl.textContent = s==='saving' ? 'Saving…' : s==='error' ? 'Offline — will retry' : 'Synced';
}

// ── EXPORT / IMPORT ──────────────────────────────────────────────
async function exportJSON() {
  const data = JSON.stringify({ clients: state.clients, hoursLog: state.hoursLog, prospects: state.prospects }, null, 2);
  const filename = `morgan-creative-crm-${today()}.json`;

  try {
    // Use save file picker so user can overwrite existing backup file
    const handle = await window.showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: 'JSON Backup', accept: { 'application/json': ['.json'] } }],
    });
    const writable = await handle.createWritable();
    await writable.write(data);
    await writable.close();
  } catch(e) {
    if (e.name === 'AbortError') return; // user cancelled, do nothing
    // Brave blocking, iPhone, or unsupported — fall back to regular download
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = filename;
    a.click();
  }
  showToast('Backup saved!');
}

function importJSON(file) {
  const reader=new FileReader();
  reader.onload=e=>{
    try {
      const p=JSON.parse(e.target.result);
      if(!p.clients&&!p.hoursLog&&!p.prospects) throw new Error('invalid');
      if(!confirm('Replace ALL data in this app with the contents of this backup file?')) return;
      applyData(p);
      scheduleAutoSave(); renderApp(); showToast('Data imported!');
    } catch { showToast('Could not read that file.',5000); }
  };
  reader.readAsText(file);
}

// Dates use YOUR time zone (toISOString() is UTC, which is tomorrow after 7pm Eastern).
function localDate(x){ x=x||new Date(); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function today(){ return localDate(); }
function parseLocal(d){ const [y,m,dd]=String(d).split('-').map(Number); return new Date(y,(m||1)-1,dd||1); }
function fmt(d){ if(!d)return''; const[y,m,dd]=d.split('-'); return `${m}/${dd}/${y}`; }
function fmtTime(t){ if(!t)return''; const[h,m]=t.split(':'); const hr=parseInt(h); return `${hr%12||12}:${m} ${hr>=12?'PM':'AM'}`; }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function isOverdue(d){ return !!d && parseLocal(d) < parseLocal(today()); }
function isDueSoon(d){ if(!d)return false; const diff=Math.round((parseLocal(d)-parseLocal(today()))/864e5); return diff>=0&&diff<=7; }
function clientHours(id){ return state.hoursLog.filter(h=>h.clientId===id).reduce((s,h)=>s+Number(h.hours),0); }
function clientLabel(c){ return c.contactName?c.businessName+' \u2014 '+c.contactName:c.businessName; }
function isBillableWork(c){ return c.service!=='Volunteer Work' && c.service!=='Internal'; }
function getInv(c){ return INV.find(i=>i.id===(c.invoiceStatus||'not_invoiced'))||INV[0]; }
function getQuest(c){ return QUEST.find(i=>i.id===(c.questionnaireStatus||'not_sent'))||QUEST[0]; }
function getContract(c){ return CONTRACT.find(i=>i.id===(c.contractStatus||'not_sent'))||CONTRACT[0]; }
function getEntryType(h){ return ENTRY_TYPES.find(t=>t.id===(h.entryType||'billable'))||ENTRY_TYPES[0]; }
function showToast(msg,dur=3000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),dur);
}
function copyToClipboard(text, label){
  const done=()=>showToast(label||'Copied to clipboard');
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch(e){ showToast('Could not copy — try selecting manually',4000); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}

  const archived = state.clients.filter(c=>c.archived);

  let cards='', dividerPlaced=false;
  active.forEach((c,i)=>{
    if(!dividerPlaced && i>0 && isBillableWork(active[i-1]) && !isBillableWork(c)){
      cards+=`<div class="home-group-divider"></div>`;
      dividerPlaced=true;
    }
    cards+=renderCard(c);
  });
  const activeSection = `<div class="stage-cards-row" style="padding:0">${cards}</div>`;

  const archivedCards = archived.map(c=>renderCard(c,true)).join('');
  const archiveSection = `
    <div class="archive-section">
      <div class="archive-head" data-action="toggle-archive">
        <span class="archive-head-label">Past Clients (${archived.length})</span>
        <span class="archive-chevron ${state.showArchive?'open':''}">&#9660;</span>
      </div>
      ${state.showArchive?(archivedCards?`<div class="archive-cards">${archivedCards}</div>`:`<div class="archive-empty">No past clients yet.</div>`):''}
    </div>`;

  const addPanel = state.showAdd==='client'?renderAddClientPanel():'';
  return `
    ${addPanel}
    ${active.length?activeSection:`<div class="empty-state">No active clients yet.${renderSampleCta()}</div>`}
    ${archiveSection}`;
}

function renderCard(c, isArchived=false) {
  const inv=getInv(c), con=getContract(c), qst=getQuest(c);
  const hrs=clientHours(c.id);
  const over=isOverdue(c.dueDate), soon=isDueSoon(c.dueDate);
  const dueClass=over?'due-over':soon?'due-soon':'due-ok';
  const duePrefix=over?'Overdue \u00b7 ':soon?'Due soon \u00b7 ':'Due \u00b7 ';
  const isBillableWk = isBillableWork(c);
  const showFollowUp = c.needsFollowUp && !isArchived;
  const archiveBtn = isArchived
    ? `<button class="icon-btn" data-action="unarchive-client" data-id="${c.id}" title="Restore to Active">${ICON_RETURN}</button>`
    : `<button class="icon-btn flip-icon" data-action="archive-client" data-id="${c.id}" title="Move to Past">${ICON_RETURN}</button>`;
  const followUpBtn = !isArchived
    ? `<button class="icon-btn followup-toggle${c.needsFollowUp?' on':''}" data-action="toggle-followup" data-id="${c.id}" title="${c.needsFollowUp?'Clear follow-up flag':'Flag for follow-up'}">${ICON_FLAG}</button>`
    : '';
  return `<div class="card${isArchived?' archived':''}${c.needsFollowUp&&!isArchived?' needs-followup':''}">
    <div class="card-top">
      <div>
        <div class="card-name card-name-link" data-action="open-detail" data-id="${c.id}" title="Open details">${esc(c.businessName)}</div>
        ${c.contactName?`<div class="card-contact">${esc(c.contactName)}</div>`:''}
      </div>
      <span class="card-icons">
        ${followUpBtn}
        <button class="icon-btn" data-action="edit-client" data-id="${c.id}">${ICON_PENCIL}</button>
        ${archiveBtn}
        <button class="icon-btn del" data-action="del-client" data-id="${c.id}">${ICON_CLOSE}</button>
      </span>
    </div>
    ${c.email?`<button type="button" class="card-email" data-action="copy-email" data-email="${esc(c.email)}">${esc(c.email)}</button>`:''}
    ${extraContactsHtml(c.contacts)}
    ${copyAllLink(c.email,c.contacts)}
    <button type="button" class="card-info-link" data-action="open-detail" data-id="${c.id}">${hasInfo(c)?'Client Info':'+ Add Client Info'}</button>
    <div class="card-divider"></div>
    ${(c.service||(c.referralSource&&c.referralSource!=='—'))?`<div class="card-detail">${[c.service?esc(c.service):'',c.referralSource&&c.referralSource!=='—'?'Via '+esc(c.referralSource):''].filter(Boolean).join(' \u00b7 ')}</div>`:''}
    ${(c.value||hrs>0)?`<div class="card-detail card-detail-strong">${[c.value?currency(c.value):'',hrs>0?hrs.toFixed(1)+' hrs logged':''].filter(Boolean).join(' \u00b7 ')}</div>`:''}
    ${c.dueDate?`<div class="card-detail ${dueClass}">${duePrefix}${fmt(c.dueDate)}</div>`:''}
    <div class="card-note${c.notes?'':' empty'}" data-action="edit-client-notes" data-id="${c.id}" title="Click to ${c.notes?'edit':'add a'} note">${c.notes?esc(c.notes):'Add a note\u2026'}</div>
    ${(isBillableWk||showFollowUp)?`<div class="badge-row">
      ${isBillableWk?`<span class="inv-badge" style="color:${inv.color};background:${inv.bg}">${inv.label}</span>
      <span class="contract-badge" style="color:${con.color};background:${con.bg}">${con.label}</span>
      ${!isArchived?`<span class="contract-badge" title="Questionnaire: ${qst.label}" style="color:${qst.color};background:${qst.bg}">Questionnaire</span>`:''}`:''}

// ── RENDER — HOURS ───────────────────────────────────────────────
function renderHours() {
  const billableHrs=state.hoursLog.filter(h=>(h.entryType||'billable')==='billable').reduce((s,h)=>s+Number(h.hours),0);
  const volunteerHrs=state.hoursLog.filter(h=>h.entryType==='volunteer').reduce((s,h)=>s+Number(h.hours),0);
  const internalHrs=state.hoursLog.filter(h=>h.entryType==='internal').reduce((s,h)=>s+Number(h.hours),0);

  const breakdown=`<div class="hours-breakdown">
    <div class="breakdown-card billable"><div class="breakdown-label billable">Billable</div><div class="breakdown-val">${billableHrs.toFixed(1)} hrs</div></div>
    <div class="breakdown-card volunteer"><div class="breakdown-label volunteer">Volunteer</div><div class="breakdown-val">${volunteerHrs.toFixed(1)} hrs</div></div>
    <div class="breakdown-card internal"><div class="breakdown-label internal">Internal</div><div class="breakdown-val">${internalHrs.toFixed(1)} hrs</div></div>
  </div>`;

  const sorted=[...state.hoursLog].sort((a,b)=>a.date<b.date?1:-1);
  const summaryCards=state.clients.filter(c=>clientHours(c.id)>0).sort((a,b)=>clientHours(b.id)-clientHours(a.id)).map(c=>{
    const hrs=clientHours(c.id), rate=c.value&&hrs>0?Number(c.value)/hrs:null;
    return `<div class="summary-card">
      <div class="summary-name">${esc(c.businessName)}</div>
      ${c.contactName?`<div class="summary-detail">${esc(c.contactName)}</div>`:''}
      <div class="summary-detail">${hrs.toFixed(1)} hrs${rate?` \u00b7 \u2248 ${currency(rate)}/hr`:''}</div>
    </div>`;
  }).join('');

  const rows=sorted.map(h=>{
    const cl=state.clients.find(c=>c.id===h.clientId);
    const et=getEntryType(h);
    return `<tr>
      <td class="muted h-date">${fmt(h.date)}</td>
      <td class="h-client"><span style="font-weight:600">${esc(cl?cl.businessName:'Removed')}</span>
        ${cl&&cl.contactName?`<span class="h-contact" style="font-size:0.75rem;color:var(--mid);display:block">${esc(cl.contactName)}</span>`:''}</td>
      <td class="h-hours">${Number(h.hours).toFixed(2)}<span class="h-unit"> hrs</span></td>
      <td class="h-type"><span class="type-pill ${et.id}">${et.label}</span></td>
      <td class="muted h-note">${esc(h.note||'')}</td>
      <td class="h-actions"><div class="row-actions">
        <button class="icon-btn" data-action="edit-entry" data-id="${h.id}">${ICON_PENCIL}</button>
        <button class="icon-btn del" data-action="del-entry" data-id="${h.id}">${ICON_CLOSE}</button>
      </div></td>
    </tr>`;
  }).join('');

  const addPanel=state.showAdd==='entry'?renderAddEntryPanel():'';
  const canAdd=state.clients.length>0;
  return `
    ${!canAdd?'<p style="font-size:0.82rem;color:var(--muted);margin-bottom:1rem">Add a client first to log hours.</p>':''}
    ${addPanel}
    ${breakdown}
    ${summaryCards?`<div class="summary-grid">${summaryCards}</div>`:''}
    ${rows?`<div class="table-wrap"><table class="hours-table">
      <thead><tr><th>Date</th><th>Client</th><th>Hours</th><th>Type</th><th>Note</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`:'<div class="empty-state">No hours logged yet.</div>'}`;
}

// ── AUTO LOGGER ──────────────────────────────────────────────────
function autoLog(clientId, description, type='Note') {
  const now=new Date();
  const idx = state.clients.findIndex(c=>c.id===clientId);
  if (idx > -1) {
    if (!state.clients[idx].activities) state.clients[idx].activities = [];
    state.clients[idx].activities.push({
      id: uid(), type, description,
      date: localDate(now),
      time: now.toTimeString().slice(0,5),
      auto: true,
    });
  }
}

// ── CLIENT DETAIL MODAL ───────────────────────────────────────────
// ── CLIENT INFO (contact, web, social, brand, logins, custom) ────
// Passwords are deliberately NOT stored here — logins point to your password manager.
const PASSWORD_HOME = '1Password';
// Single fields per section (lists like domains, colors, fonts are handled separately below)
const INFO_FIELDS = {
  contact: [
    { k:'businessEmail', l:'Business Email',  t:'email' },
    { k:'phone',         l:'Phone',           t:'tel' },
    { k:'address',       l:'Mailing Address', t:'textarea' } ],
  web: [
    { k:'hosting',       l:'Website Platform / Host', t:'text', ph:'e.g. Squarespace' } ],
  brand: [
    { k:'assetsLink',    l:'Brand Files Link', t:'url', ph:'Link to logo files / brand guide' } ],
};
const ALL_INFO_FIELDS = [...INFO_FIELDS.contact, ...INFO_FIELDS.web, ...INFO_FIELDS.brand];
const SOCIAL_PLATFORMS = ['Instagram','Facebook','LinkedIn','TikTok','X (Twitter)','YouTube','Pinterest','Threads','Google Business','Other'];
const ACCOUNT_SUGGESTIONS = ['Squarespace','GoDaddy','Google Workspace','Google Business Profile','Canva','Instagram','Facebook','Mailchimp','Shopify','WordPress','Wix'];
const FONT_USES = ['Headings','Body','Accent','Logo'];

// Reads a client's info, upgrading anything saved in the earlier single-field format.
function getInfo(c){
  const i={ ...(c.info||{}) };
  let domains=i.domains||[], colors=i.colors, fonts=i.fonts, custom=i.custom||[];
  if(!i.domains){
    const names=[...new Set([i.domain,i.website].filter(Boolean).map(v=>String(v).replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/.*$/,'')))];
    domains=names.map((d,n)=>({ domain:d, registrar:n===0?(i.registrar||''):'', renewalDate:n===0?(i.renewalDate||''):'' }));
    if(!names.length && (i.registrar||i.renewalDate)) domains=[{domain:'',registrar:i.registrar||'',renewalDate:i.renewalDate||''}];
  }
  if(typeof colors==='string') colors=colors.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{ const m=x.match(/#?[0-9a-f]{6}\b|#[0-9a-f]{3}\b/i); return { name:(m?x.replace(m[0],''):x).replace(/[:\-–]\s*$/,'').trim(), hex:m?normHex(m[0]):'' }; });
  if(typeof fonts==='string') fonts=fonts.trim()?[{use:'',name:fonts}]:[];
  if(i.tagline && !custom.some(x=>x.label==='Tagline')) custom=[{label:'Tagline',value:i.tagline},...custom];
  return { ...i, domains, colors:colors||[], fonts:fonts||[], socials:i.socials||[], accounts:i.accounts||[], custom };
}
function hasInfo(c){
  const i=getInfo(c);
  return ALL_INFO_FIELDS.some(f=>i[f.k]) || i.domains.length || i.colors.length || i.fonts.length || i.socials.length || i.accounts.length || i.custom.length;
}
function normHex(v){ v=String(v||'').trim(); if(!v) return ''; if(!v.startsWith('#')) v='#'+v; return v.toUpperCase(); }
function validHex(v){ return /^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(v); }
function looksLikeUrl(v){ return /^https?:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v); }
function hrefFor(v,type){
  v=String(v).trim();
  if(type==='email'||(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))) return 'mailto:'+v;
  if(type==='tel') return 'tel:'+v.replace(/[^\d+]/g,'');
  if(looksLikeUrl(v)) return /^https?:\/\//i.test(v)?v:'https://'+v;
  return '';
}
function infoValueHtml(v,type){
  const h=hrefFor(v,type);
  const txt=type==='date'?fmt(v):esc(v);
  return h?`<a href="${esc(h)}" target="_blank" rel="noopener">${txt}</a>`:`<span>${txt}</span>`;
}
function copyBtn(text,label){ return `<button class="icon-btn info-copy" data-action="copy-text" data-text="${esc(text)}" data-label="${esc(label)} copied" title="Copy">${ICON_COPY}</button>`; }
function infoRow(label,value,type,sub){
  if(!value) return '';
  return `<div class="info-item">
    <div class="info-label">${esc(label)}</div>
    <div class="info-value${type==='textarea'?' multiline':''}">${infoValueHtml(value,type)}${sub?`<div class="info-sub">${sub}</div>`:''}</div>
    ${copyBtn(type==='date'?fmt(value):value,label)}
  </div>`;
}
function renderInfoView(c){
  const i=getInfo(c), groups=[];
  const group=(title,body)=>{ if(body) groups.push(`<div class="info-group"><div class="info-group-title">${title}</div>${body}</div>`); };

  group('Contact &amp; Business', INFO_FIELDS.contact.map(f=>infoRow(f.l,i[f.k],f.t)).join(''));

  group('Web &amp; Domain',
    INFO_FIELDS.web.map(f=>infoRow(f.l,i[f.k],f.t)).join('') +
    i.domains.map((d,n)=>{
      const sub=[d.registrar?esc(d.registrar):'', d.renewalDate?'Renews '+fmt(d.renewalDate):''].filter(Boolean).join(' · ');
      return d.domain ? infoRow(i.domains.length>1?`Domain ${n+1}`:'Domain', d.domain, 'url', sub)
                      : (sub?`<div class="info-item"><div class="info-label">Domain</div><div class="info-value"><div class="info-sub">${sub}</div></div><span></span></div>`:'');
    }).join(''));

  group('Brand',
    i.colors.map(col=>{
      const hex=normHex(col.hex), sw=validHex(hex)?`<span class="swatch" style="background:${hex}"></span>`:'';
      return `<div class="info-item">
        <div class="info-label">${esc(col.name||'Color')}</div>
        <div class="info-value color-val">${sw}<span>${esc(hex||'—')}</span></div>
        ${hex?copyBtn(hex,(col.name||'Hex')):'<span></span>'}
      </div>`;
    }).join('') +
    i.fonts.map(f=>infoRow(f.use||'Font', f.name, 'text')).join('') +
    INFO_FIELDS.brand.map(f=>infoRow(f.l,i[f.k],f.t)).join(''));

  group('Social Media', i.socials.map(x=>infoRow(x.platform||'Social',x.value,'text')).join(''));

  group('Accounts &amp; Logins', i.accounts.map(a=>`
    <div class="info-account">
      <div class="info-account-name">${esc(a.platform||'Account')}</div>
      ${infoRow('Login URL',a.url,'url')}
      ${infoRow('Username / Email',a.username,'text')}
      ${a.password?`<div class="info-item">
        <div class="info-label">Password</div>
        <div class="info-value pw-val" data-pw="${esc(a.password)}">••••••••</div>
        <span class="pw-btns"><button class="icon-btn" data-action="toggle-pw" title="Show / hide">${ICON_EYE}</button>${copyBtn(a.password,'Password')}</span>
      </div>`:(a.url||a.username?`<div class="info-pw-note">Password saved in ${PASSWORD_HOME}</div>`:'')}
      ${a.note?`<div class="info-account-note">${esc(a.note)}</div>`:''}
    </div>`).join(''));

  group('Other', i.custom.map(x=>infoRow(x.label||'Note',x.value,'text')).join(''));

  return groups.length?groups.join(''):`<p class="info-empty">No client info yet. Add their contact details, domains, brand colors and fonts, socials and logins so everything is in one place.</p>`;
}
function infoAsText(c){
  const i=getInfo(c), out=[`${c.businessName} — Client Info`];
  const sec=(title,lines)=>{ lines=lines.filter(Boolean); if(lines.length){ out.push('',title); out.push(...lines); } };
  const kv=(l,v)=>v?`${l}: ${v}`:'';
  sec('CONTACT & BUSINESS', INFO_FIELDS.contact.map(f=>kv(f.l,i[f.k])));
  sec('WEB & DOMAIN', [ ...INFO_FIELDS.web.map(f=>kv(f.l,i[f.k])),
    ...i.domains.map(d=>d.domain||d.registrar?`Domain: ${d.domain||'—'}${d.registrar?' · '+d.registrar:''}${d.renewalDate?' · renews '+fmt(d.renewalDate):''}`:'') ]);
  sec('BRAND', [ ...i.colors.map(col=>`${col.name||'Color'}: ${normHex(col.hex)||'—'}`),
    ...i.fonts.map(f=>kv(f.use||'Font',f.name)), ...INFO_FIELDS.brand.map(f=>kv(f.l,i[f.k])) ]);
  sec('SOCIAL MEDIA', i.socials.map(x=>kv(x.platform||'Social',x.value)));
  sec('ACCOUNTS & LOGINS', i.accounts.map(a=>`${a.platform||'Account'}${a.username?' — '+a.username:''}${a.url?' ('+a.url+')':''}${a.note?' · '+a.note:''}`));
  sec('OTHER', i.custom.map(x=>kv(x.label||'Note',x.value)));
  return out.join('\n');
}

function saveClientInfo(id){
  const c=state.clients.find(x=>x.id===id); if(!c) return;
  const info={};
  ALL_INFO_FIELDS.forEach(f=>{ const v=gv('ci-'+f.k).trim(); if(v) info[f.k]=v; });
  const rows=box=>[...document.querySelectorAll('#'+box+' .info-edit-row')];
  const val=(r,cls)=>((r.querySelector(cls)||{}).value||'').trim();
  info.domains =rows('ci-domains').map(r=>({domain:val(r,'.ir-domain').replace(/^https?:\/\//i,'').replace(/\/$/,''),registrar:val(r,'.ir-registrar'),renewalDate:val(r,'.ir-renew')})).filter(d=>d.domain||d.registrar||d.renewalDate);
  info.colors  =rows('ci-colors').map(r=>({name:val(r,'.ir-a'),hex:normHex(val(r,'.ir-hex'))})).filter(x=>x.name||x.hex);
  info.fonts   =rows('ci-fonts').map(r=>({use:val(r,'.ir-a'),name:val(r,'.ir-b')})).filter(x=>x.name);
  info.socials =rows('ci-socials').map(r=>({platform:val(r,'.ir-a'),value:val(r,'.ir-b')})).filter(x=>x.value);
  info.accounts=rows('ci-accounts').map(r=>({platform:val(r,'.ir-platform'),url:val(r,'.ir-url'),username:val(r,'.ir-user'),password:((r.querySelector('.ir-pass')||{}).value||''),note:val(r,'.ir-note')})).filter(x=>x.platform||x.url||x.username||x.password);
  info.custom  =rows('ci-custom').map(r=>({label:val(r,'.ir-a'),value:val(r,'.ir-b')})).filter(x=>x.label||x.value);
  c.info=info;
  scheduleAutoSave(); renderApp(); openClientDetail(id); showToast('Client info saved');
}

function g(id){ return document.getElementById(id); }
function gv(id){ return (g(id)||{}).value||''; }
function gr(name){ const el=document.querySelector(`input[name="${name}"]:checked`); return el?el.value:'billable'; }

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const action=el.dataset.action, id=el.dataset.id, clientId=el.dataset.clientId||el.dataset.id, prospectId=el.dataset.prospectId||el.dataset.id;
  switch(action){
    case 'tab': state.tab=el.dataset.tab; state.showAdd=null; renderApp(); break;
    case 'export-json': exportJSON(); break;
    case 'import-json': g('import-input').click(); break;
    case 'export-csv': exportCSV(); break;
    case 'toggle-archive': state.showArchive=!state.showArchive; renderApp(); break;

    case 'toggle-add-client': state.showAdd=state.showAdd==='client'?null:'client'; renderApp(); break;
    case 'add-contact-row': {
      const target=g(el.dataset.target);
      if(target) target.insertAdjacentHTML('beforeend', contactRowHtml());
      break;
    }
    case 'remove-contact-row': {
      const row=el.closest('.contact-row');
      if(row) row.remove();
      break;
    }
    case 'save-new-client': {
      const biz=gv('nc-biz').trim();
      if(!biz){ showToast('Business name is required.'); break; }
      state.clients.push({
        id:uid(), dateAdded:today(), archived:false,
        businessName:biz, contactName:gv('nc-contact').trim(), email:gv('nc-email'),
        service:gv('nc-service'), value:gv('nc-value'),
        notes:gv('nc-notes'), dueDate:gv('nc-due'), invoiceStatus:gv('nc-inv')||'not_invoiced',
        contractStatus:gv('nc-con')||'not_sent', questionnaireStatus:gv('nc-qst')||'not_sent',
        referralSource:gv('nc-ref')==='—'?'':gv('nc-ref'),
        needsFollowUp:false,
        contacts: collectContacts('nc-contacts-extra'),
        activities:[], tasks:[],
      });
      state.showAdd=null; scheduleAutoSave(); renderApp(); showToast('Client added.');
      break;
    }
    case 'edit-client': openEditClient(id); break;
    case 'edit-client-notes': openEditClient(id, true); break;
    case 'save-edit-client': {
      const biz=gv('ec-biz').trim();
      if(!biz){ showToast('Business name is required.'); break; }
      const idx=state.clients.findIndex(c=>c.id===id);
      if(idx>-1){
        const old=state.clients[idx];
        const newInv=gv('ec-inv'), newCon=gv('ec-con'), newQst=gv('ec-qst');
        if(newInv&&newInv!==old.invoiceStatus) autoLog(id,'Invoice status: '+(INV.find(i=>i.id===newInv)?.label||newInv));
        if(newCon&&newCon!==old.contractStatus) autoLog(id,'Contract status: '+(CONTRACT.find(i=>i.id===newCon)?.label||newCon));
        if(newQst&&newQst!==(old.questionnaireStatus||'not_sent')) autoLog(id,'Brand questionnaire: '+(QUEST.find(i=>i.id===newQst)?.label||newQst));
      }
      if(idx>-1) Object.assign(state.clients[idx],{
        businessName:biz, contactName:gv('ec-contact').trim(), email:gv('ec-email'),
        service:gv('ec-service'), value:gv('ec-value'),
        notes:gv('ec-notes'), dueDate:gv('ec-due'), invoiceStatus:gv('ec-inv'),
        contractStatus:gv('ec-con'), questionnaireStatus:gv('ec-qst'), referralSource:gv('ec-ref')==='—'?'':gv('ec-ref'),
        contacts: collectContacts('ec-contacts-extra'),
      });
      closeModal(); scheduleAutoSave(); renderApp();
      break;
    }
    case 'copy-email': copyToClipboard(el.dataset.email, 'Email copied'); break;
    case 'copy-all-emails': copyToClipboard(el.dataset.emails, 'All emails copied'); break;
    case 'toggle-followup': {
      const idx=state.clients.findIndex(c=>c.id===id);
      if(idx>-1){
        state.clients[idx].needsFollowUp=!state.clients[idx].needsFollowUp;
        autoLog(id,state.clients[idx].needsFollowUp?'Flagged for follow-up':'Follow-up flag cleared');
        scheduleAutoSave(); renderApp();
      }
      break;
    }
    case 'archive-client': {
      const idx=state.clients.findIndex(c=>c.id===id);
      if(idx>-1){ autoLog(id,'Client moved to Past'); state.clients[idx].archived=true; scheduleAutoSave(); renderApp(); showToast('Client moved to Past.'); }
      break;
    }
    case 'unarchive-client': {
      const idx=state.clients.findIndex(c=>c.id===id);
      if(idx>-1){ autoLog(id,'Client restored to Active'); state.clients[idx].archived=false; scheduleAutoSave(); renderApp(); showToast('Client restored to Active.'); }
      break;
    }
    case 'del-client':
      if(confirm('Permanently delete this client and all their hours? This cannot be undone.')){
        state.clients=state.clients.filter(c=>c.id!==id);
        state.hoursLog=state.hoursLog.filter(h=>h.clientId!==id);
        scheduleAutoSave(); renderApp();
      }
      break;

    case 'toggle-add-prospect': state.showAdd=state.showAdd==='prospect'?null:'prospect'; renderApp(); break;
    case 'save-new-prospect': {
      const biz=gv('np-biz').trim();
      if(!biz){ showToast('Business name is required.'); break; }
      state.prospects.push({
        id:uid(), dateAdded:today(),
        businessName:biz, contactName:gv('np-contact').trim(), email:gv('np-email'),
        referralSource:gv('np-ref')==='—'?'':gv('np-ref'),
        nextContactDate:gv('np-next'),
        lastContactDate:gv('np-last'), contactMethod:gv('np-method')==='—'?'':gv('np-method'),
        notes:gv('np-notes'),
        contacts: collectContacts('np-contacts-extra'),
        archived:false, converted:false,
      });
      state.showAdd=null; scheduleAutoSave(); renderApp(); showToast('Prospect added.');
      break;
    }
    case 'edit-prospect': openEditProspect(id); break;
    case 'edit-prospect-notes': openEditProspect(id, true); break;
    case 'save-edit-prospect': {
      const biz=gv('ep-biz').trim();
      if(!biz){ showToast('Business name is required.'); break; }
      const idx=state.prospects.findIndex(p=>p.id===id);
      if(idx>-1) Object.assign(state.prospects[idx],{
        businessName:biz, contactName:gv('ep-contact').trim(), email:gv('ep-email'),
        referralSource:gv('ep-ref')==='—'?'':gv('ep-ref'),
        nextContactDate:gv('ep-next'),
        lastContactDate:gv('ep-last'), contactMethod:gv('ep-method')==='—'?'':gv('ep-method'),
        notes:gv('ep-notes'),
        contacts: collectContacts('ep-contacts-extra'),
      });
      closeModal(); scheduleAutoSave(); renderApp();
      break;
    }
    case 'del-prospect':
      if(confirm('Permanently delete this prospect? This cannot be undone.')){
        state.prospects=state.prospects.filter(p=>p.id!==id);
        scheduleAutoSave(); renderApp();
      }
      break;
    case 'move-to-active': {
      const idx=state.prospects.findIndex(p=>p.id===id);
      if(idx>-1){
        const p=state.prospects[idx];
        const carriedActivities=(p.activities||[]).map(a=>({...a}));
        carriedActivities.push({ id:uid(), type:'Note', description:'Converted from Outreach',
          date:today(), time:nowTime(), auto:true });
        const newClient={
          id:uid(), dateAdded:today(), archived:false,
          businessName:p.businessName, contactName:p.contactName, email:p.email,
          service:'', value:'', notes:p.notes, dueDate:'', invoiceStatus:'not_invoiced',
          contractStatus:'not_sent', questionnaireStatus:'not_sent', referralSource:p.referralSource, needsFollowUp:false,
          contacts:(p.contacts||[]).map(ct=>({...ct})),
          activities:carriedActivities,
          tasks:[],
        };
        state.clients.push(newClient);
        p.archived=true; p.converted=true;
        scheduleAutoSave(); renderApp(); showToast(`${p.businessName} moved to Active clients.`);
      }
      break;
    }
    case 'mark-prospect-inactive': {
      const idx=state.prospects.findIndex(p=>p.id===id);
      if(idx>-1){
        if(!state.prospects[idx].activities) state.prospects[idx].activities=[];
        state.prospects[idx].activities.push({ id:uid(), type:'Note', description:'Marked Closed Lost',
          date:today(), time:nowTime(), auto:true });
        state.prospects[idx].archived=true; scheduleAutoSave(); renderApp(); showToast('Marked inactive.');
      }
      break;
    }
    case 'restore-prospect': {
      const idx=state.prospects.findIndex(p=>p.id===id);
      if(idx>-1){ state.prospects[idx].archived=false; state.prospects[idx].converted=false; scheduleAutoSave(); renderApp(); showToast('Restored to active outreach.'); }
      break;
    }
    case 'toggle-inactive-prospects': state.showInactiveProspects=!state.showInactiveProspects; renderApp(); break;

    case 'toggle-add-entry': state.showAdd=state.showAdd==='entry'?null:'entry'; renderApp(); break;
    case 'save-new-entry': {
      const clientId=gv('ne-client'), hours=parseFloat(gv('ne-hours'));
      if(!clientId){ showToast('Please select a client.'); break; }
      if(!hours||hours<=0){ showToast('Please enter valid hours.'); break; }
      state.hoursLog.push({
        id:uid(), clientId, hours, entryType:gr('ne-type'),
        date:gv('ne-date')||today(), note:gv('ne-note'),
      });
      state.showAdd=null; scheduleAutoSave(); renderApp(); showToast('Hours logged.');
      break;
    }
    case 'edit-entry': openEditEntry(id); break;
    case 'save-edit-entry': {
      const clientId=gv('ee-client'), hours=parseFloat(gv('ee-hours'));
      if(!clientId||!hours||hours<=0){ showToast('Please fill in all fields.'); break; }
      const idx=state.hoursLog.findIndex(h=>h.id===id);
      if(idx>-1) Object.assign(state.hoursLog[idx],{clientId,hours,date:gv('ee-date'),note:gv('ee-note'),entryType:gr('ee-type')});
      closeModal(); scheduleAutoSave(); renderApp();
      break;
    }
    case 'del-entry':
      if(confirm('Delete this time entry?')){
        state.hoursLog=state.hoursLog.filter(h=>h.id!==id);
        scheduleAutoSave(); renderApp();
      }
      break;
    case 'open-detail': openClientDetail(id); break;
    case 'edit-client-info': openEditClientInfo(id); break;
    case 'save-client-info': saveClientInfo(id); break;
    case 'copy-client-info': { const c=state.clients.find(x=>x.id===id); if(c) copyToClipboard(infoAsText(c),'Client info copied'); break; }
    case 'copy-text': copyToClipboard(el.dataset.text, el.dataset.label||'Copied'); break;
    case 'add-info-row': {
      const L=INFO_LISTS[el.dataset.kind], box=L&&g(L.box);
      if(box){ box.insertAdjacentHTML('beforeend', L.row()); const f=box.lastElementChild.querySelector('input'); if(f) f.focus(); }
      break;
    }
    case 'toggle-pw': {
      const v=el.closest('.info-item').querySelector('.pw-val');
      if(v){ const shown=v.classList.toggle('shown'); v.textContent=shown?v.dataset.pw:'\u2022'.repeat(8); }
      break;
    }
    case 'toggle-pw-input': {
      const inp=el.parentElement.querySelector('.ir-pass'); if(inp) inp.type=inp.type==='password'?'text':'password';
      break;
    }
    case 'remove-info-row': { const r=el.closest('.info-edit-row'); if(r) r.remove(); break; }

    case 'toggle-add-task': {
      const f=g('add-task-form'); if(f) f.style.display=f.style.display==='none'?'block':'none'; break;
    }
    case 'save-new-task': {
      const desc=gv('nt-desc').trim();
      if(!desc){ showToast('Please enter a task description.'); break; }
      const idx=state.clients.findIndex(c=>c.id===clientId);
      if(idx>-1){
        if(!state.clients[idx].tasks) state.clients[idx].tasks=[];
        state.clients[idx].tasks.push({ id:uid(), description:desc, dueDate:gv('nt-due'), completed:false });
        scheduleAutoSave(); openClientDetail(clientId); renderApp();
      }
      break;
    }
    case 'toggle-task': {
      const clientId=el.dataset.clientId;
      const cIdx=state.clients.findIndex(c=>c.id===clientId);
      if(cIdx>-1){
        const tIdx=(state.clients[cIdx].tasks||[]).findIndex(t=>t.id===id);
        if(tIdx>-1){ state.clients[cIdx].tasks[tIdx].completed=!state.clients[cIdx].tasks[tIdx].completed; scheduleAutoSave(); openClientDetail(clientId); renderApp(); }
      }
      break;
    }
    case 'del-task': {
      const clientId=el.dataset.clientId;
      const cIdx=state.clients.findIndex(c=>c.id===clientId);
      if(cIdx>-1){ state.clients[cIdx].tasks=(state.clients[cIdx].tasks||[]).filter(t=>t.id!==id); scheduleAutoSave(); openClientDetail(clientId); renderApp(); }
      break;
    }
    case 'toggle-completed-tasks': {
      const cv=g('completed-tasks-visible'); if(cv) cv.style.display=cv.style.display==='none'?'block':'none'; break;
    }

    case 'toggle-add-activity': {
      const f=g('add-activity-form'); if(f) f.style.display=f.style.display==='none'?'block':'none'; break;
    }
    case 'save-new-activity': {
      const desc=gv('na-desc').trim();
      if(!desc){ showToast('Please enter a description.'); break; }
      const idx=state.clients.findIndex(c=>c.id===clientId);
      if(idx>-1){
        if(!state.clients[idx].activities) state.clients[idx].activities=[];
        state.clients[idx].activities.push({ id:uid(), type:gv('na-type')||'Note', date:gv('na-date')||today(), time:gv('na-time')||nowTime(), description:desc });
        scheduleAutoSave(); openClientDetail(clientId); renderApp();
      }
      break;
    }
    case 'del-activity': {
      const clientId=el.dataset.clientId;
      const cIdx=state.clients.findIndex(c=>c.id===clientId);
      if(cIdx>-1){ state.clients[cIdx].activities=(state.clients[cIdx].activities||[]).filter(a=>a.id!==id); scheduleAutoSave(); openClientDetail(clientId); renderApp(); }
      break;
    }
    case 'quick-log':
      state.tab='hours'; state.showAdd='entry'; renderApp(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'load-sample': loadSampleData(); break;
    case 'sign-out': signOut(); break;
    case 'close-modal': closeModal(); break;
  }
});

document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('modal-overlay')) closeModal();
});

document.addEventListener('keydown', e=>{
  if(!document.getElementById('modal-overlay').classList.contains('open')) return;
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key!=='Enter' || e.target.tagName==='TEXTAREA') return;
  const saveBtn=document.querySelector('#modal-box [data-action^="save-"]');
  if(saveBtn){ e.preventDefault(); saveBtn.click(); }
});

document.addEventListener('keydown', e=>{
  const panel=document.querySelector('.add-panel');
  if(!panel) return;
  if(e.key==='Escape'){
    const cancelBtn=panel.querySelector('[data-action^="toggle-add-"]');
    if(cancelBtn) cancelBtn.click();
    return;
  }
  if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){
    const saveBtn=panel.querySelector('[data-action^="save-new-"]');
    if(saveBtn && !saveBtn.disabled){ e.preventDefault(); saveBtn.click(); }
  }
});

document.getElementById('import-input').addEventListener('change', e=>{
  const file=e.target.files[0]; if(file) importJSON(file); e.target.value='';
});

document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); saveData(); showToast('Saved!'); }
});

// Floating button: after it opens a form, bring the form into view.
document.addEventListener('click', e=>{ if (e.target.closest('.fab')) setTimeout(()=>window.scrollTo({top:0, behavior:'smooth'}), 0); });

document.addEventListener('submit', e=>{
  if (e.target.id!=='login-form') return;
  e.preventDefault();
  signIn(gv('li-email').trim(), gv('li-pass'));
});

// Stay in sync: pull fresh data when returning to the app, retry saves when back online.
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') refreshFromRemote(); });
window.addEventListener('focus', refreshFromRemote);
window.addEventListener('online', ()=>{ if (dirty) saveData(); else refreshFromRemote(); });
setInterval(()=>{ if (document.visibilityState==='visible') refreshFromRemote(); }, 60000);
window.addEventListener('beforeunload', e=>{ if (dirty) { saveData(); e.preventDefault(); e.returnValue=''; } });

// ── INIT ─────────────────────────────────────────────────────────
async function init() {
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) { renderSetupNeeded(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: { persistSession:true, autoRefreshToken:true, storageKey:'mc-crm-sync-auth' },
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) await startSession(data.session);
  else renderLogin();
}
init();
</script>
</body>
</html>
